<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutreTB - Nuevos Horizontes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a365d">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background-color: #f4f7f6; color: #333; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h1 { color: #1a365d; font-size: 20px; margin-top: 0; }
    h2 { color: #2b6cb0; font-size: 16px; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
    input, select, button, textarea { width: 100%; padding: 6px; margin-top: 6px; border-radius: 6px; border: 1px solid #ccc; }
    button { background-color: #2b6cb0; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 16px; }
    button:hover { background-color: #1a365d; }
    .status { margin-top: 10px; padding: 10px; background: #e2e8f0; border-radius: 6px; font-size: 13px; }
    .alert-success { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    .alert-warning { background: #e6fffa; color: #234e52; border: 1px solid #9ae6b4; }
  </style>
</head>
<body>

  <div class="card">
    <h1>NutreTB</h1>
    <form id="demoForm">
      <label for="name">Nombre</label>
      <input type="text" id="name" required>
      <label for="district">Distrito</label>
      <input type="text" id="district" required>
      <button type="submit">Guardar Datos</button>
    </form>
    <div id="demoStatus" class="status" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Evolución de Peso</h2>
    <form id="weightForm">
      <label for="weight">Peso (lbs)</label>
      <input type="number" id="weight" required>
      <label for="comorbidity">Comorbilidad</label>
      <input type="text" id="comorbidity">
      <button type="submit">Registrar Peso</button>
    </form>
    <ul id="weightHistory"></ul>
  </div>

  <div class="card">
    <h2>Control de Adherencia</h2>
    <form id="adherenceForm">
      <label for="tookMeds">¿Tomó medicamento hoy?</label>
      <select id="tookMeds">
        <option value="Sí">Sí</option>
        <option value="No">No</option>
      </select>
      <button type="submit">Registrar</button>
    </form>
    <div id="adherenceAlert" class="status" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Solicitud de Entregas</h2>
    <button id="btnNutreTB">Solicitar Bolsa Nutre TB</button>
    <ul id="deliveryList"></ul>
  </div>

  <div class="card">
    <h2>Lista de Pacientes</h2>
    <ul id="patientList"></ul>
  </div>

  <script>
    // 1. Datos demográficos
    document.getElementById('demoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const district = document.getElementById('district').value;
      
      const status = document.getElementById('demoStatus');
      status.className = 'status alert-success';
      status.style.display = 'block';
      status.innerText = `Datos demográficos guardados para: ${name} (${district})`;
    });

    // 2. Historial de Evolución de Peso
    let weights = JSON.parse(localStorage.getItem('weight_list')) || [];
    function updateWeightUI() {
      const list = document.getElementById('weightHistory');
      if (weights.length > 0) {
        list.innerHTML = weights.map(w => `<li><strong>${w.date}:</strong> ${w.weight} lbs (${w.comorbidity})</li>`).join('');
      }
    }
    updateWeightUI();

    document.getElementById('weightForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const wVal = document.getElementById('weight').value;
      const cVal = document.getElementById('comorbidity').value;
      const today = new Date().toLocaleDateString();
      weights.push({ date: today, weight: wVal, comorbidity: cVal });
      localStorage.setItem('weight_list', JSON.stringify(weights));
      updateWeightUI();
      document.getElementById('weight').value = '';
    });

    // 3. Alertas de Adherencia
    document.getElementById('adherenceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const took = document.getElementById('tookMeds').value;
      const alertBox = document.getElementById('adherenceAlert');
      alertBox.style.display = 'block';
      if (took === 'Sí') {
        alertBox.className = 'status alert-success';
        alertBox.innerText = '¡Excelente! Has registrado la toma exitosa de tu medicamento de hoy.';
      } else {
        alertBox.className = 'status alert-warning';
        alertBox.innerText = `ALERTA DE ADHERENCIA REGISTRADA: "${took}". Se notificará al promotor de la Asociación para brindarle apoyo.`;
      }
    });

    // 4. Registro y Solicitud de Entregas Nutre TB
    document.getElementById('btnNutreTB').addEventListener('click', function() {
      const list = document.getElementById('deliveryList');
      const today = new Date().toLocaleDateString();
      const newItem = document.createElement('li');
      newItem.innerHTML = `<strong>Solicitud ${today}:</strong> Bolsa Nutre TB - <span style="color:#dd6b20;">En Proceso</span>`;
      list.appendChild(newItem);
    });

    // Registro del Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // 5. Cargar pacientes desde la hoja de cálculo
    fetch('https://script.google.com/macros/s/AKfycbz-3WOJR5DFS6aeL81AqhsrPdmV1_WqfUmb-vGSOvVZ_hlzhf6-Seg-yLk1TO96DQHkrg/exec')
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('patientList');
        data.forEach(patient => {
          const li = document.createElement('li');
          li.textContent = `Nombre: ${patient.Nombre}, Edad: ${patient.Edad}, Estado: ${patient['Estado CLIN']}`;
          list.appendChild(li);
        });
      })
      .catch(error => console.error('Error al obtener los datos:', error));
  </script>
</body>
</html>
